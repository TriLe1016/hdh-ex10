        <text x="153.33333333333331" y="305" font-family="'Outfit', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">FIFO</text>
        
        <rect x="265.0" y="129.53976122399493" width="70" height="150.46023877600507" fill="url(#policyGrad)" rx="6"/>
        <text x="300.0" y="121.53976122399493" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">0.006s</text>
        <text x="300.0" y="305" font-family="'Outfit', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Round Robin</text>
        
        <rect x="411.66666666666663" y="120.0" width="70" height="160.0" fill="url(#policyGrad)" rx="6"/>
