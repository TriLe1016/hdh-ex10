        <text x="545.0" y="340" font-family="'Outfit', sans-serif" font-size="12" fill="#a3a3a3" text-anchor="middle">2 W</text>
        
        <rect x="595.0" y="100.0" width="40" height="220.0" fill="url(#purpleGrad)" rx="4"/>
