        <text x="615.0" y="340" font-family="'Outfit', sans-serif" font-size="12" fill="#a3a3a3" text-anchor="middle">4 W</text>
        
        <rect x="665.0" y="101.59913236108545" width="40" height="218.40086763891455" fill="url(#purpleGrad)" rx="4"/>
