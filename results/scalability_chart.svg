    <line x1="80" y1="320" x2="360" y2="320" stroke="#374151" stroke-width="1"/>
    <line x1="80" y1="80" x2="80" y2="320" stroke="#374151" stroke-width="1"/>
    
        <rect x="95.0" y="100.0" width="40" height="220.0" fill="url(#blueGrad)" rx="4"/>
