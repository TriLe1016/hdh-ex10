        <text x="255.0" y="340" font-family="'Outfit', sans-serif" font-size="12" fill="#a3a3a3" text-anchor="middle">4 Workers</text>
        
        <rect x="305.0" y="264.0200012447933" width="40" height="55.9799987552067" fill="url(#blueGrad)" rx="4"/>
        <text x="325.0" y="256.0200012447933" font-family="'Outfit', sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">0.10s</text>
        <text x="325.0" y="340" font-family="'Outfit', sans-serif" font-size="12" fill="#a3a3a3" text-anchor="middle">8 Workers</text>
        
    <text x="580" y="65" font-family="'Outfit', sans-serif" font-size="14" fill="#a3a3a3" text-anchor="middle">Throughput (Tasks/s) - Higher is Better</text>
    <line x1="440" y1="320" x2="720" y2="320" stroke="#374151" stroke-width="1"/>
    <line x1="440" y1="80" x2="440" y2="320" stroke="#374151" stroke-width="1"/>
    
        <rect x="455.0" y="264.42690773380684" width="40" height="55.57309226619317" fill="url(#purpleGrad)" rx="4"/>
        <text x="475.0" y="256.42690773380684" font-family="'Outfit', sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">246.28/s</text>
        <text x="475.0" y="340" font-family="'Outfit', sans-serif" font-size="12" fill="#a3a3a3" text-anchor="middle">1 W</text>
        
        <rect x="525.0" y="209.47035899927243" width="40" height="110.52964100072755" fill="url(#purpleGrad)" rx="4"/>
