        <text x="185.0" y="340" font-family="'Outfit', sans-serif" font-size="12" fill="#a3a3a3" text-anchor="middle">2 Workers</text>
        
        <rect x="235.0" y="264.42690773380684" width="40" height="55.57309226619317" fill="url(#blueGrad)" rx="4"/>
